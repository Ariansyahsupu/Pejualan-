        export default function App() {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [products, setProducts] = useState([]);
          const [isLoadingProducts, setIsLoadingProducts] = useState(true);
          const [sales, setSales] = useState([]);
          const [expenses, setExpenses] = useState([]);
          const [capitalReturns, setCapitalReturns] = useState([]);
          const [stocks, setStocks] = useState([]); // Variabel wadah SOH

          useEffect(() => {
            const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSMYPiHfpDtnOIMdbzSvbhUn1Fd1XFDX8s-smQLvGqgVoasE8t-r4DQPmzysVIj6PbRvkQY_tPbIRI_/pub?gid=0&single=true&output=csv";
            
            fetch(csvUrl)
              .then(res => res.text())
              .then(csvText => {
                const parseCSVRow = (str) => {
                  let result = [], current = '', inQuotes = false;
                  for (let i = 0; i < str.length; i++) {
                    let char = str[i];
                    if (inQuotes) {
                      if (char === '"') {
                         if (str[i+1] === '"') { current += '"'; i++; } else { inQuotes = false; }
                      } else { current += char; }
                    } else {
                      if (char === '"') { inQuotes = true; }
                      else if (char === ',') { result.push(current); current = ''; }
                      else { current += char; }
                    }
                  }
                  result.push(current);
                  return result.map(s => s.trim());
                };

                const parseIDR = (str) => {
                   if (!str) return 0;
                   let clean = str.replace(/Rp/gi, '').replace(/\./g, '').replace(/\s/g, '').replace(/,/g, '.');
                   return parseFloat(clean) || 0;
                };

                const rows = csvText.split('\n');
                const fetchedProducts = [];
                
                for (let i = 1; i < rows.length; i++) {
                   if (!rows[i].trim()) continue;
                   const row = parseCSVRow(rows[i]);
                   if (!row[0]) continue;
                   
                   const name = row[0];
                   const price = parseIDR(row[1]);
                   const mCost = parseIDR(row[2]);
                   const lCost = parseIDR(row[3]);
                   const pTR = parseIDR(row[4]);
                   const locis = parseIDR(row[5]);
                   const karet = parseIDR(row[6]);
                   const serbuk = parseIDR(row[7]);
                   const pLokas = parseIDR(row[8]);
                   const sertifikat = row[9];
                   const certCost = parseIDR(row[10]);
                   const biayaKirimTipe = row[11];
                   const bKirim = parseIDR(row[12]);

                   const kemasanCost = pTR + locis + karet + serbuk + pLokas;
                   const hpp = mCost + lCost + kemasanCost; 

                   fetchedProducts.push({
                     id: i, name, materialCost: mCost, laborCost: lCost,
                     pTR, locis, karet, serbuk, pLokas, kemasanCost,
                     sertifikatCost: certCost, biayaKirimCost: bKirim, hpp, price, sertifikat
                   });
                }
                setProducts(fetchedProducts);
                setIsLoadingProducts(false);
              })

                 console.error("Gagal mengambil data Produk:", err);
                 setIsLoadingProducts(false);
              });

            fetch(salesCsvUrl)
              .then(res => res.text())
              .then(csvText => {
                const parseCSVRow = (str) => {
                  let result = [], current = '', inQuotes = false;
                  for (let i = 0; i < str.length; i++) {
                    let char = str[i];
                    if (inQuotes) {
                      if (char === '"') {
                         if (str[i+1] === '"') { current += '"'; i++; } else { inQuotes = false; }
                      } else { current += char; }
                    } else {
                      if (char === '"') { inQuotes = true; }
                      else if (char === ',') { result.push(current); current = ''; }
                      else { current += char; }
                    }
                  }
                  result.push(current);
                  return result.map(s => s.trim());
                };

                const parseIDR = (str) => {
                   if (!str) return 0;
                   let strStr = str.toString();
                   let isNegative = strStr.includes('-') || (strStr.includes('(') && strStr.includes(')'));
                   let clean = strStr.replace(/[^0-9]/g, '');
                   let val = parseFloat(clean) || 0;
                   return isNegative ? -val : val;
                };

                const rows = csvText.split('\n');
                const fetchedSales = [];
                for (let i = 1; i < rows.length; i++) {
                  if (!rows[i].trim()) continue;
                  const row = parseCSVRow(rows[i]);
                  if (!row[0]) continue;
                  
                  let date = row[0] || '';
                  let buyerName = row[1] || '-';
                  let province = row[2] || '';
                  let area = row[3] || '';
                  let productName = row[4] || '';
                  let qty = parseInt(row[5]) || 0;
                  let bonusQty = parseInt(row[6]) || 0;
                  
                  let coaBahan = parseIDR(row[7]);
                  let coaTenaga = parseIDR(row[8]);
                  let coaPeralatan = parseIDR(row[9]);

                  let isFormatBaru = row.length >= 15;
                  
                  let coaMarketing = isFormatBaru ? parseIDR(row[10]) : 0;
                  let coaKirim = isFormatBaru ? parseIDR(row[11]) : 0;
                  
                  let revenueIndex = isFormatBaru ? 12 : 10;
                  let profitIndex = isFormatBaru ? 13 : 11;
                  let statusIndex = isFormatBaru ? 14 : 12;

                  let rawRevenue = row[revenueIndex] || '';
                  let revenue = rawRevenue.toLowerCase().includes('open') || rawRevenue.toLowerCase().includes('close') ? 0 : parseIDR(rawRevenue);
                  
                  let rawProfit = row[profitIndex] || '';
                  let profit = rawProfit.toLowerCase().includes('open') || rawProfit.toLowerCase().includes('close') ? 0 : parseIDR(rawProfit);
                  
                  let paymentStatus = row.length > statusIndex ? (row[statusIndex] || 'Open') : 'Open';
                  
                  let totalCost = coaBahan + coaTenaga + coaPeralatan + coaMarketing + coaKirim;

                  fetchedSales.push({
                    id: i, date, buyerName, province, area, productName, qty, bonusQty,
                    coaBahan, coaTenaga, coaPeralatan, coaMarketing, coaKirim,
                    totalCost, revenue, profit, paymentStatus
                  });
                }
                setSales(fetchedSales.reverse());
              })

            const expCsvUrl = "https://docs.google.com/spreadsheets/d/19muvmAtdRxYJckDuXADBz3PbDaSQKtbLy3fwEwUwGcU/export?format=csv&gid=376046659";
            fetch(expCsvUrl)
              .then(res => res.text())
              .then(csvText => {
                const parseCSVRow = (str) => {
                  let result = [], current = '', inQuotes = false;
                  for (let i = 0; i < str.length; i++) {
                    let char = str[i];
                    if (inQuotes) {
                      if (char === '"') {

              fetch(SCRIPT_URL, {

              }).catch(err => console.error(err));
              setNewExpense({ ...newExpense, name: '', amount: '' });

            const [selectedMonth, setSelectedMonth] = useState('');
            const availableMonths = useMemo(() => { const m = new Set(expenses.map(e => e.date.substring(0, 7)).filter(d => d.length === 7)); return Array.from(m).sort().reverse(); }, [expenses]);
            const formatMonth = (ym) => { const [y, m] = ym.split('-'); const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember']; return `${months[parseInt(m, 10)-1]} ${y}`; };
            const filteredExpenses = useMemo(() => { if (!selectedMonth) return expenses; return expenses.filter(e => e.date.substring(0, 7) === selectedMonth); }, [expenses, selectedMonth]);
            const totalPengeluaran = useMemo(() => { return filteredExpenses.reduce((sum, e) => sum + e.amount, 0); }, [filteredExpenses]);

            const inputClass = "w-full px-4 py-2.5 bg-neutral-50/50 border border-neutral-200 text-neutral-900 text-[13px] rounded-xl focus:outline-none focus:ring-4 focus:ring-neutral-900/5 focus:border-neutral-900 transition-all placeholder:text-neutral-400 font-semibold";

            const labelClass = "block text-[12px] font-bold text-neutral-700 mb-2 truncate";
            const cardClasses = "bg-white p-6 md:p-8 rounded-2xl border border-neutral-200/60 shadow-[0_4px_24px_rgba(0,0,0,0.02)]";

                            <td className="px-4 py-4 text-right text-neutral-600 tabular-nums whitespace-nowrap">{formatRupiah(s.pricePerKampil)}</td>
                            <td className="px-4 py-4 text-right font-bold text-green-700 tabular-nums whitespace-nowrap">{formatRupiah(s.value)}</td>
                            <td className="px-3 py-4 text-center"><button onClick={() => handleDeleteStock(s.id)} className="text-neutral-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100"><Trash2 size={16} /></button></td>
                          </tr>
                        ))}
                        {filteredStocks.length === 0 && (<tr><td colSpan="10" className="px-6 py-12 text-center text-neutral-400 font-medium text-[13px]">Tidak ada riwayat stok.</td></tr>)}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          };

          return (
            <div className="flex flex-col md:flex-row h-screen bg-[#fafafa] overflow-hidden text-neutral-900 font-sans selection:bg-neutral-900 selection:text-white">
              <Sidebar />
              <div className="flex-1 overflow-y-auto">
                {activeTab === 'dashboard' && <DashboardView />}
                {activeTab === 'products' && <ProductsView />}
                {activeTab === 'sales' && <SalesView />}
                {activeTab === 'expenses' && <ExpensesView />}
                {activeTab === 'capital' && <CapitalReturnView />}
                {activeTab === 'stock' && <StockView />}
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
