              .then(res => res.text())
              .then(csvText => {
                const parseCSVRow = (str) => {
                  let result = [], current = '', inQuotes = false;
                  for (let i = 0; i < str.length; i++) {
                    let char = str[i];
                    if (inQuotes) {
                      if (char === '"') {
                         if (str[i+1] === '"') { current += '"'; i++; } else { inQuotes = false; }
                      } else { current += char; }
                    } else {
                      if (char === '"') { inQuotes = true; }

                    }

              if (saleId > 1000000000) {

              setSales(sales.map(s => s.id === saleId ? { ...s, paymentStatus: 'Close' } : s));

                headers: { "Content-Type": "text/plain;charset=utf-8" },

                  action: "updateStatus",
                  sheetName: "Jurnal Transaksi",

                return;
              }

              const qtyNum = parseInt(newSale.qty);
              const bonusQty = parseInt(newSale.bonusQty) || 0;
              const revenue = p.price * qtyNum;
              const totalQty = qtyNum + bonusQty;

              const laborPacking = parseFloat(newSale.laborPacking) || 0;
              const boxCost = parseFloat(newSale.pilihanPackingCost) || 0;
              
              const coaBahan = (p.materialCost || 0) * totalQty;
              const coaTenagaSortir = (p.laborCost || 0) * totalQty;
              const coaTenagaTotal = coaTenagaSortir + laborPacking;
              
              const pTR_total = (p.pTR || 0) * totalQty;
              const locis_total = (p.locis || 0) * totalQty;
              const karet_total = (p.karet || 0) * totalQty;
              const serbuk_total = (p.serbuk || 0) * totalQty;
              const pLokas_total = (p.pLokas || 0) * totalQty;
              const coaPeralatanTotal = pTR_total + locis_total + karet_total + serbuk_total + pLokas_total + boxCost;
              
              const coaMarketing = revenue * 0.05;

                    coaPeralatanTotal,

                    coaKirim, 
                    revenue, 
                    finalProfit,

                  ]
                })

                            <td className="px-3 py-3 text-right font-medium text-black tabular-nums whitespace-nowrap text-[11px]">{formatRupiah(s.coaMarketing || 0)}</td>
                            <td className="px-3 py-3 text-right font-medium text-black tabular-nums whitespace-nowrap text-[11px]">{formatRupiah(s.coaKirim || 0)}</td>
                            <td className="px-3 py-3 text-right font-medium text-black tabular-nums whitespace-nowrap">{formatRupiah(s.revenue)}</td>
                            <td className="px-3 py-3 text-right font-semibold text-black tabular-nums whitespace-nowrap">{formatRupiah(s.profit)}</td>
                            <td className="px-3 py-3 text-center">
                              {s.paymentStatus === 'Close' || s.paymentStatus === 'close' ? (
                                <span className="bg-neutral-100 border border-neutral-200 text-black px-2 py-0.5 rounded text-[10px] font-semibold">CLOSED</span>
                              ) : (
                                <button onClick={() => handleUpdateStatus(s.id)} className="bg-neutral-900 hover:bg-black text-white px-2.5 py-1 rounded text-[10px] font-medium transition-colors shadow-sm">
                                  Set Close
                                </button>
                              )}
                            </td>
                            <td className="px-3 py-3 text-center">
                              <button onClick={() => handleDeleteSale(s.id)} className="text-neutral-400 hover:text-black transition-colors"><Trash2 size={15} /></button>
                            </td>
                          </tr>
                        ))}
                        {sales.length === 0 && (<tr><td colSpan="16" className="px-4 py-8 text-center text-neutral-400 text-sm">Tidak ada data penjualan.</td></tr>)}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          };

          return (
            <div className="flex flex-col md:flex-row h-screen bg-[#fafafa] overflow-hidden text-neutral-900">
              <Sidebar />
              <div className="flex-1 overflow-y-auto">
                {activeTab === 'dashboard' && <DashboardView />}
                {activeTab === 'products' && <ProductsView />}
                {activeTab === 'sales' && <SalesView />}
                {activeTab === 'expenses' && <ExpensesView />}
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
